server:
  port: 8000
  # The gateway is the client-IP trust boundary: its own view of the caller comes from the TCP
  # socket, never from forwarding headers the caller controls.
  forward-headers-strategy: none

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Without this property Spring Cloud Gateway swaps the X-Forwarded-* filter for one that
          # strips every X-Forwarded-* header, so the monolith would see the gateway's IP for every
          # user (one IP ban = everyone banned, one per-IP login limit shared by all). '.*' is safe
          # ONLY because EdgeHeaders first deletes every client-supplied forwarding header:
          # the X-Forwarded-For the monolith receives is exactly the socket peer the gateway saw.
          trusted-proxies: ".*"
          httpclient:
            connect-timeout: 2000
            # No response-timeout on purpose: SSE verdict streams stay open until the monolith ends them.
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins:
                  - "http://localhost:5173"
                  - "http://localhost"
                allowed-methods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
                allowed-headers: "*"
                allow-credentials: true

oj:
  gateway:
    monolith-uri: ${MONOLITH_URI:http://judge-api:8000}
    expose-api-docs: false

management:
  server:
    # Actuator lives on its own port, which compose does not publish, so /actuator is never
    # reachable through the public :8000.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
